# 推送到 main：校验 → 构建 → SEO 检查 → 计算 IndexNow 差异 → 部署 Cloudflare Pages → 通知 IndexNow
# 网站目前由 Cloudflare Pages 的 GitHub 集成自动部署。仓库没有设置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 时，
# 这里只做检查，跳过重复的 wrangler 部署与 IndexNow 推送；设置这两个 Secrets 后会恢复由本工作流部署。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run build
      - run: npm run check:seo
      - run: npm run test:search
      - run: npm run links
      - name: IndexNow 差异（部署前读取线上旧清单）
        run: npm run indexnow:diff
      - name: 未设置 Cloudflare Secrets：跳过本工作流的部署（网站由 Cloudflare Pages GitHub 集成部署）
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::未设置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过 wrangler 部署与 IndexNow 推送；检查已全部通过。"
      - name: 部署到 Cloudflare Pages
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vpntizi-blog --branch=main
      - name: 等待 CDN 生效
        if: env.HAS_CF_SECRETS == 'true'
        run: sleep 30
      - name: 通知 IndexNow（新增 / 更新 / 删除）
        if: env.HAS_CF_SECRETS == 'true'
        run: npm run indexnow:submit
        continue-on-error: true
